<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NŪRA — Панель управления</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><text x='50' y='64' text-anchor='middle' font-family='Georgia,serif' font-size='36' font-weight='400' letter-spacing='4' fill='%23b8956a'>NR</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <img src="logo.svg" alt="NŪRA" class="login-logo">
        <h2>Панель управления</h2>
        <form id="loginForm">
            <div class="login-field">
                <label for="loginUser">Логин</label>
                <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
            </div>
            <div class="login-field">
                <label for="loginPass">Пароль</label>
                <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password">
            </div>
            <div class="login-error" id="loginError"></div>
            <button type="submit" class="login-btn">Войти</button>
        </form>
    </div>
</div>

<!-- Admin Layout -->
<div class="admin" id="adminLayout" style="display:none">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__logo">
            <img src="logo.svg" alt="NŪRA" class="sidebar__logo-img">
            <span class="sidebar__badge">Admin</span>
        </div>
        <nav class="sidebar__nav">
            <button class="sidebar__link active" data-page="dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Дашборд
            </button>
            <button class="sidebar__link" data-page="orders">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                Заказы
            </button>
            <button class="sidebar__link" data-page="products">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                Товары
            </button>
            <button class="sidebar__link" data-page="customers">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                Клиенты
            </button>
            <button class="sidebar__link" data-page="warehouse">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7l-8-4-8 4m16 0v10l-8 4M4 7v10l8 4m0-14v14"/></svg>
                Склад
            </button>
            <button class="sidebar__link" data-page="bank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                Банковские счета
            </button>
            <button class="sidebar__link" data-page="staff">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                Сотрудники
            </button>
        </nav>
        <div class="sidebar__footer">
            <a href="index.html" class="sidebar__link sidebar__link--muted">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                Перейти на сайт
            </a>
            <button class="sidebar__link sidebar__link--muted" id="logoutBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Выйти
            </button>
        </div>
    </aside>

    <!-- Mobile header -->
    <header class="admin-header" id="adminHeader">
        <button class="admin-header__burger" id="adminBurger">
            <span></span><span></span><span></span>
        </button>
        <span class="admin-header__title">NŪRA Admin</span>
        <button class="admin-header__logout" id="logoutBtn2" title="Выйти">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="admin-main" id="adminMain">
        <!-- Pages rendered by JS -->
    </main>
</div>

<!-- Product Modal -->
<div class="adm-modal" id="productModal">
    <div class="adm-modal__content" id="productModalContent">
        <!-- Rendered by JS -->
    </div>
</div>

<!-- Staff Modal -->
<div class="adm-modal" id="staffModal">
    <div class="adm-modal__content" id="staffModalContent">
        <!-- Rendered by JS -->
    </div>
</div>

<script src="products.js"></script>
<script src="admin.js"></script>
</body>
</html>
